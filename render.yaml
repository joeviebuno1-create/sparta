services:
  - type: web
    name: sparta-backend
    runtime: python
    region: singapore   # closest to PH — change to "oregon" if you prefer US West
    plan: starter       # $7/mo — always-on, no cold starts. Use "free" only for testing.
    branch: main        # change if your production branch is different

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Auto-deploy every time you push to the branch above
    autoDeploy: true

    # ── Environment Variables ────────────────────────────────────────
    # Set these in the Render dashboard under Environment → Secret Files
    # or paste them one by one. DO NOT commit real values here.
    envVars:
      # Database — paste your Neon connection string here
      # Format: postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false   # means Render will prompt you to fill it in the dashboard

      # App security
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value

      - key: IS_PRODUCTION
        value: "true"

      # Session token expiry (hours)
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "8"

      # Cloudinary (for image uploads)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Add any other keys your database.py or rag_chatbot.py use
      # e.g. OpenAI / Anthropic API keys if your RAG chatbot uses them:
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false

    # Health check — Render pings this to confirm your app started
    healthCheckPath: /

    # ── Disk (optional) ─────────────────────────────────────────────
    # Only needed if your app writes files locally (uploads, temp files).
    # Since you use Cloudinary for images, you probably don't need this.
    # Uncomment if you do:
    # disk:
    #   name: sparta-data
    #   mountPath: /app/data
    #   sizeGB: 1
